name: Verify public links

on:
  push:
    branches: ['claude/**']
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Purge stale cache and confirm branding on the public URL
        run: |
          base="https://raw.githack.com/usm19/Recycler/gh-pages"
          title() { curl -sSL --max-time 20 "$base/index.html" | grep -o "<title>[^<]*</title>" || echo "fetch failed"; }
          echo "== before: $(title)"
          echo "== discover purge endpoint from githack homepage"
          curl -sSL --max-time 20 https://raw.githack.com/ | grep -io '<form[^>]*>' | head -5 || true
          curl -sSL --max-time 20 https://raw.githack.com/ | grep -io 'purge[^"<]*' | head -10 || true
          echo "== attempt purges"
          for f in index.html styles.css js/app.js js/calc.js js/rules.js js/journal.js sw.js manifest.webmanifest icons/icon-192.png icons/icon-512.png icons/icon-maskable-512.png icons/apple-touch-icon.png; do
            curl -sS -o /dev/null -w "PURGE $f -> %{http_code}\n" -X PURGE --max-time 20 "$base/$f" || true
          done
          curl -sS -o /dev/null -w "POST /purge -> %{http_code}\n" --max-time 20 -X POST --data-urlencode "url=$base/index.html" "https://raw.githack.com/purge" || true
          echo "== re-check title over ~4 minutes"
          for i in 1 2 3 4 5 6 7 8; do
            t=$(title)
            echo "check $i: $t"
            case "$t" in *Calculator*) echo "FRESH ✓"; exit 0;; esac
            sleep 30
          done
          echo "still stale after 4 min (will self-heal when the CDN TTL lapses)"
