name: Verify public links

on:
  push:
    branches: ['claude/**']
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe the public URL and confirm current branding
        run: |
          base="https://raw.githack.com/usm19/Recycler/gh-pages"
          echo "== page"
          curl -sSL -o /tmp/index.html -w "status=%{http_code} type=%{content_type} bytes=%{size_download}\n" --max-time 20 "$base/index.html"
          grep -o "<title>[^<]*</title>" /tmp/index.html || echo "no title found"
          grep -o 'class="brand-name">[^<]*' /tmp/index.html || echo "no brand name found"
          echo "== manifest"
          curl -sSL --max-time 20 "$base/manifest.webmanifest" | grep -E '"(name|short_name)"' || echo "manifest fetch failed"
          echo "== service worker"
          curl -sSL --max-time 20 "$base/sw.js" | head -2
          curl -sSL --max-time 20 "$base/sw.js" | grep "VERSION =" || true
          echo "== icons"
          for f in icons/apple-touch-icon.png icons/icon-192.png icons/icon-512.png icons/icon-maskable-512.png; do
            curl -sSL -o /dev/null -w "$f status=%{http_code} type=%{content_type} bytes=%{size_download}\n" --max-time 20 "$base/$f"
          done
          echo "== styles + app js reachable"
          for f in styles.css js/app.js js/calc.js js/rules.js; do
            curl -sSL -o /dev/null -w "$f status=%{http_code} type=%{content_type} bytes=%{size_download}\n" --max-time 20 "$base/$f"
          done
