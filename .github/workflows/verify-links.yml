name: Verify public links

on:
  push:
    branches: ['claude/**']
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe candidate public URLs
        run: |
          probe() {
            echo "== $1"
            curl -sSL -o /tmp/body -w "status=%{http_code} type=%{content_type} bytes=%{size_download}\n" --max-time 20 "$1" || echo "curl-failed"
            head -c 100 /tmp/body | tr -d '\0'; echo; echo
          }
          probe "https://usm19.github.io/Recycler/"
          probe "https://cdn.jsdelivr.net/gh/usm19/Recycler@gh-pages/index.html"
          probe "https://cdn.statically.io/gh/usm19/Recycler/gh-pages/index.html"
          probe "https://raw.githack.com/usm19/Recycler/gh-pages/index.html"
          probe "https://rawcdn.githack.com/usm19/Recycler/gh-pages/index.html"
          echo "== asset MIME checks (JS must be application/javascript for the service worker)"
          for u in \
            "https://cdn.jsdelivr.net/gh/usm19/Recycler@gh-pages/sw.js" \
            "https://cdn.jsdelivr.net/gh/usm19/Recycler@gh-pages/js/app.js" \
            "https://cdn.statically.io/gh/usm19/Recycler/gh-pages/sw.js" \
            "https://cdn.statically.io/gh/usm19/Recycler/gh-pages/js/app.js" \
            "https://raw.githack.com/usm19/Recycler/gh-pages/sw.js" ; do
            echo "== $u"
            curl -sSL -o /dev/null -w "status=%{http_code} type=%{content_type}\n" --max-time 20 "$u" || echo "curl-failed"
          done
